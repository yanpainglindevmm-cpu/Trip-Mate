<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>"Sexy Boy Yan | Chat Together"</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="travel-background">
  <div class="sun"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div>
  <div class="plane"><svg viewBox="0 0 120 60"><path d="M8 32 L65 25 L104 10 L112 13 L76 31 L112 40 L108 44 L67 36 L20 42 Z"/></svg></div>
  <div class="wave wave-one"></div><div class="wave wave-two"></div>
</div>
<main class="auth-wrapper">
<section class="brand-area">
  <p class="brand-small">TRAVEL • PEOPLE • EXPERIENCES</p>
  <h1>WANDER<span>LY</span></h1>
  <p class="brand-description">Discover new places.<br>Find people to travel with.</p>
</section>
<section class="login-card">
  <div class="card-heading"><p class="eyebrow">WELCOME BACK</p><h2>Start your journey.</h2><p>Sign in and find your next travel experience.</p></div>
  <form id="loginForm">
    <div class="input-group"><label for="loginEmail">Gmail</label><input type="email" id="loginEmail" placeholder="yourname@gmail.com" required></div>
    <div class="input-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required></div>
    <div class="login-options"><label class="remember"><input type="checkbox" id="rememberMe"><span>Remember me</span></label><a href="forgot-password.html">Forgot password?</a></div>
    <button type="submit" class="primary-button">SIGN IN <span>→</span></button>
  </form>
  <div class="divider"><span>OR</span></div>
  <div class="create-link"><span>New to WANDERLY?</span><a href="create-account.html">Create account</a></div>
  <p id="loginMessage" class="form-message"></p>
</section>
</main>
<script src="login.js"></script>
</body>
</html>
