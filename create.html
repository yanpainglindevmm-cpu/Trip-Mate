<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANDERLY | Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="travel-background">
        <div class="sun"></div>
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>

        <div class="plane">
            <svg viewBox="0 0 120 60">
                <path d="M8 32 L65 25 L104 10 L112 13 L76 31 L112 40 L108 44 L67 36 L20 42 Z"></path>
            </svg>
        </div>

        <div class="wave wave-one"></div>
        <div class="wave wave-two"></div>
    </div>

    <main class="form-page-wrapper">

        <section class="form-header">
            <a href="index.html" class="back-link">← Back to login</a>
            <p class="eyebrow">JOIN THE JOURNEY</p>
            <h1>Create your account.</h1>
            <p>
                Meet travelers. Discover places.<br>
                Make your next trip memorable.
            </p>
        </section>

        <section class="form-card">

            <form id="createAccountForm" action="register.php" method="POST">

                <div class="form-grid">

                    <div class="input-group full">
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="birthday">Birthday</label>
                        <input
                            type="date"
                            id="birthday"
                            name="birthday"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="female">Female</option>
                            <option value="male">Male</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="input-group full">
                        <label for="email">Gmail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="yourname@gmail.com"
                            required
                        >
                    </div>

                    <div class="input-group full">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+81 90 1234 5678"
                            required
                        >
                    </div>

                    <div class="input-group full">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            minlength="8"
                            required
                        >
                        <small>Minimum 8 characters</small>
                    </div>

                    <div class="input-group full">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            required
                        >
                    </div>

                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>
                        I agree to the Terms of Service and Privacy Policy.
                    </span>
                </label>

                <button type="submit" class="primary-button">
                    CREATE ACCOUNT <span>→</span>
                </button>

                <p id="createMessage" class="form-message"></p>

            </form>

        </section>

    </main>

    <script src="create-account.js"></script>

</body>
</html>
